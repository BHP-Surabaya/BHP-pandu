services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bhp_pandu_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-false}
    env_file:
      - .env
    volumes:
      - ./storage/app/public:/var/www/html/storage/app/public
      - ./storage/logs:/var/www/html/storage/logs
    networks:
      - bhp_network

  # Opsional: Database MySQL Lokal jika tidak menggunakan database cloud (TiDB)
  # Untuk menggunakan MySQL lokal:
  # 1. Buka komentar blok 'db' dan blok 'volumes: db_data' di bawah
  # 2. Ubah DB_HOST=db dan DB_PORT=3306 pada file .env
  # db:
  #   image: mysql:8.0
  #   container_name: bhp_pandu_db
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_DATABASE: ${DB_DATABASE:-bhp_permohonan_wasiat}
  #     MYSQL_USER: ${DB_USERNAME:-root}
  #     MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
  #     MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
  #   ports:
  #     - "${FORWARD_DB_PORT:-3306}:3306"
  #   volumes:
  #     - db_data:/var/lib/mysql
  #   networks:
  #     - bhp_network

networks:
  bhp_network:
    driver: bridge

